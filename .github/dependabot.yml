version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['@playwright/*', '@axe-core/*']
      everything-else:
        patterns: ['*']
    ignore:
      # Major upgrades are done deliberately, not automatically.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
